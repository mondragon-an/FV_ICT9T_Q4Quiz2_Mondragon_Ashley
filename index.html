<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grades analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        body{
            margin: 100px; 
            text-align: center;
            font-family: Poppins;
            text-shadow: 0px 0px 8px #8e95a5;
            background-image: url(https://i.pinimg.com/736x/00/1d/fa/001dfafc2677f64da503ec6883e21695.jpg);
        }
        h1{
            font-style: italic;
        }
        .wow{
            background-color: rgb(192, 219, 235);
            padding: 50px;
            border: 10px black solid;
            border-radius: 25px;
        }
        button{
            margin: 160px;
        }
        .btn{
            background-color: white;
            border: 7px black solid;
            border-radius: 12px;
            font-size: 24px;
            box-shadow: 0px 0px 8px #8e95a5;
        }
        
    </style>
</head>

<body>
<div class="wow">
<h1>score analyzer ⋆. 𐙚 ̊</h1>
<details ontoggle="message()">
    <summary>instructions</summary>
    <i id="toilet"></i>
</details>
<div class="container">
    <div class="row">
      <div class="col">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128" color="#000000" fill="none">
            <path d="M11.223 6V7.98898C11.223 9.38733 11.223 10.0865 11.4102 10.7577C11.5974 11.4289 11.9644 12.0452 12.6984 13.2779L13.6929 14.9482C15.5632 18.0892 16.4984 19.6597 15.7312 20.824L15.7193 20.8418C14.9409 22 12.9606 22 9 22C5.03938 22 3.05907 22 2.2807 20.8418L2.26884 20.824C1.50164 19.6597 2.43679 18.0892 4.30708 14.9482L5.30163 13.2779C6.03558 12.0452 6.40256 11.4289 6.5898 10.7577C6.77704 10.0865 6.77704 9.38733 6.77704 7.98898V6" stroke="currentColor" stroke-width="1.5" />
            <path d="M6 6L12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5.5 13.2803C6.16667 12.699 7.73448 13.1181 9.00155 13.6643C10.6682 14.3828 12.1667 13.8019 12.5 13.2803" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M11.5 7C11.5 9 13.8624 11.2121 15.4728 11C15.4728 12.6569 16.934 14 18.7364 14C20.5388 14 22 12.6569 22 11C22 9.34315 21 8 19 8C19 6 17.5 4 15.3799 4C15.3799 2.45687 14.5 2 13.5 2C12.5 2 12 3 12 3C12 3 9 3 9 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <label for="sub">science</label>
        <input type="number" class="form-control-sm" id="sci">
        <br>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128" color="#000000" fill="none">
            <path d="M5.5 3V8M8 5.5L3 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M8 16L6 18M6 18L4 20M6 18L8 20M6 18L4 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20 6L16 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20 18.5L16 18.5M20 15.5L16 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M22 12L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 22L12 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <label for="sub">math</label>
        <input type="number" class="form-control-sm" id="math">
        <br>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128" color="#000000" fill="none">
            <path d="M11.0215 6.78662V19.7866" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M11 19.5C10.7777 19.5 10.3235 19.2579 9.41526 18.7738C8.4921 18.2818 7.2167 17.7922 5.5825 17.4849C3.74929 17.1401 2.83268 16.9678 2.41634 16.4588C2 15.9499 2 15.1347 2 13.5044V7.09655C2 5.31353 2 4.42202 2.6487 3.87302C3.29741 3.32401 4.05911 3.46725 5.5825 3.75372C8.58958 4.3192 10.3818 5.50205 11 6.18114C11.6182 5.50205 13.4104 4.3192 16.4175 3.75372C17.9409 3.46725 18.7026 3.32401 19.3513 3.87302C20 4.42202 20 5.31353 20 7.09655V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20.8638 12.9393L21.5589 13.6317C22.147 14.2174 22.147 15.1672 21.5589 15.7529L17.9171 19.4485C17.6306 19.7338 17.2642 19.9262 16.8659 20.0003L14.6088 20.4883C14.2524 20.5653 13.9351 20.2502 14.0114 19.895L14.4919 17.6598C14.5663 17.2631 14.7594 16.8981 15.0459 16.6128L18.734 12.9393C19.3222 12.3536 20.2757 12.3536 20.8638 12.9393Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <label for="sub">english</label>
        <input type="number" class="form-control-sm" id="eng">
      </div>
      <div class="col">
        <button type="button" class="btn" onclick="analyze()">get rating</button>
      </div>
      <div class="w-100"></div>
    </div>
  </div>
</div>
<script>
    function message(){
     //shows instructions;
    document.getElementById("toilet").innerHTML="enter your grades in the following subjects then press the button";
}

function calculateAverage(){
    var s = parseFloat(document.getElementById("sci").value);
    var m = parseFloat(document.getElementById("math").value);
    var e = parseFloat(document.getElementById("eng").value);
    return (s + m + e) / 3;
}

function analyze(){
    var avg = calculateAverage();
    switch (true){
        case (avg >= 94):
        window.alert("your grades are excellent!");
        break;

        case (avg >= 87):
        window.alert("your grades are above standard!");
        break;

        case (avg >= 80):
        window.alert("your grades are standard.");
        break;

        case (avg >= 75):
        window.alert("your grades are in need of improvement.");
        break;

        case (avg >= 70):
        window.alert("your grades are poor.");
        break;

        default:
        window.alert("please enter your grades!");
        break;
    }
}
</script>

</body>

</html>
